<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Крестики-нолики · Space Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:    #00F5FF;
      --magenta: #FF00E4;
      --gold:    #FFD700;
      --purple:  #7B2FBE;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 25% 60%, #08002a 0%, #020818 45%, #000510 100%);
      font-family: 'Orbitron', 'Courier New', monospace;
      overflow: hidden;
      cursor: none;
    }

    /* ======= CURSOR ======= */
    #cursor {
      position: fixed;
      width: 18px; height: 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 22px var(--cyan);
      transition: width .15s, height .15s, background .15s;
    }
    #cursor-dot {
      position: fixed;
      width: 4px; height: 4px;
      background: var(--cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px var(--cyan);
    }
    #cursor-trail {
      position: fixed;
      width: 8px; height: 8px;
      background: rgba(0,245,255,0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--cyan);
    }

    /* ======= STAR CANVAS ======= */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ======= NEBULAS ======= */
    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
      animation: nebulaPulse 9s ease-in-out infinite alternate;
    }
    @keyframes nebulaPulse {
      from { transform: scale(1);    opacity: var(--op-from); }
      to   { transform: scale(1.18); opacity: var(--op-to);   }
    }

    /* ======= PARALLAX SCENE ======= */
    #scene {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .layer {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    /* ======= PLANETS ======= */
    .planet { position: absolute; border-radius: 50%; pointer-events: none; }

    /* Saturn */
    .planet-saturn {
      width: 130px; height: 130px;
      background: radial-gradient(circle at 33% 30%,
        #F9E07A, #E8A020 35%, #A04500 65%, #5A2800);
      box-shadow: inset -18px -14px 35px rgba(0,0,0,0.65),
                  0 0 50px rgba(244,208,63,0.18);
      top: 6%; right: 10%;
      animation: floatSlow 14s ease-in-out infinite alternate;
    }
    .planet-saturn::before {
      content: '';
      position: absolute;
      width: 200%; height: 38%;
      border-radius: 50%;
      border: 14px solid rgba(244,208,63,0.38);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(244,208,63,0.2);
    }
    .planet-saturn::after {
      content: '';
      position: absolute;
      width: 230%; height: 46%;
      border-radius: 50%;
      border: 5px solid rgba(230,126,34,0.18);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Gas giant – purple */
    .planet-gas {
      width: 85px; height: 85px;
      background: radial-gradient(circle at 28% 28%,
        #E8A0DC, #BB4FD8 32%, #6B00B5 62%, #3A0070);
      box-shadow: inset -12px -10px 22px rgba(0,0,0,0.55),
                  0 0 35px rgba(187,79,216,0.45);
      top: 60%; left: 6%;
      animation: floatMed 10s ease-in-out 1s infinite alternate;
    }

    /* Ice planet – blue */
    .planet-ice {
      width: 54px; height: 54px;
      background: radial-gradient(circle at 32% 25%,
        #EAF4FD, #A8D6F1 38%, #2D88C3 68%, #133E6A);
      box-shadow: inset -7px -6px 14px rgba(0,0,0,0.45),
                  0 0 22px rgba(168,214,241,0.3);
      top: 16%; left: 4%;
      animation: floatFast 8s ease-in-out infinite alternate;
    }

    /* Rocky – grey */
    .planet-rocky {
      width: 32px; height: 32px;
      background: radial-gradient(circle at 38% 30%,
        #B2BABB, #717D7E 50%, #424949);
      box-shadow: inset -4px -3px 8px rgba(0,0,0,0.55);
      top: 78%; right: 22%;
      animation: floatFast 7s ease-in-out 2.5s infinite alternate;
    }

    /* Moon – pale */
    .planet-moon {
      width: 18px; height: 18px;
      background: radial-gradient(circle at 38% 28%,
        #E8EAED, #C0C6CC 55%, #7F8C8D);
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4);
      top: 12%; right: 32%;
      animation: floatMed 11s ease-in-out 0.5s infinite alternate;
    }

    /* Teal distant planet */
    .planet-teal {
      width: 22px; height: 22px;
      background: radial-gradient(circle at 34% 28%,
        #A2ECD7, #1ABC9C 50%, #0E6650);
      box-shadow: inset -3px -2px 7px rgba(0,0,0,0.45),
                  0 0 12px rgba(26,188,156,0.35);
      top: 48%; right: 4%;
      animation: floatSlow 16s ease-in-out 3s infinite alternate;
    }

    /* Red dwarf */
    .planet-red {
      width: 40px; height: 40px;
      background: radial-gradient(circle at 30% 28%,
        #FF9580, #E74C3C 45%, #8B0000);
      box-shadow: inset -5px -4px 10px rgba(0,0,0,0.5),
                  0 0 18px rgba(231,76,60,0.4);
      top: 82%; left: 28%;
      animation: floatMed 9s ease-in-out 4s infinite alternate;
    }

    /* Asteroids */
    .asteroid {
      position: absolute;
      background: #5D6D7E;
      border-radius: 40% 60% 55% 45% / 48% 42% 58% 52%;
      box-shadow: inset -2px -1px 4px rgba(0,0,0,0.5);
    }
    .a1 { width:13px; height:9px;  top:52%; left:19%; animation: floatFast 5.5s .3s  infinite alternate; }
    .a2 { width:9px;  height:7px;  top:56%; left:21%; animation: floatFast 6.5s 1.1s infinite alternate; }
    .a3 { width:11px; height:7px;  top:50%; left:17%; animation: floatFast 7s   .7s  infinite alternate; }
    .a4 { width:7px;  height:5px;  top:33%; right:17%;animation: floatMed  8s   1.8s infinite alternate; }
    .a5 { width:10px; height:6px;  top:31%; right:19%;animation: floatMed  7.5s .9s  infinite alternate; }
    .a6 { width:8px;  height:5px;  top:70%; right:8%; animation: floatFast 6s   2s   infinite alternate; }

    @keyframes floatSlow {
      from { transform: translateY(0px)   rotate(0deg); }
      to   { transform: translateY(-22px) rotate(4deg); }
    }
    @keyframes floatMed {
      from { transform: translateY(0px)   rotate(0deg); }
      to   { transform: translateY(-14px) rotate(-6deg); }
    }
    @keyframes floatFast {
      from { transform: translateY(0px)  rotate(0deg); }
      to   { transform: translateY(-9px) rotate(10deg); }
    }

    /* ======= VIGNETTE + SCANLINES ======= */
    #vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 38%, rgba(0,0,0,0.75) 100%);
      pointer-events: none; z-index: 3;
    }
    #scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.035) 3px, rgba(0,0,0,0.035) 4px
      );
      pointer-events: none; z-index: 4;
    }

    /* ======= GAME ======= */
    .game-wrapper {
      position: relative; z-index: 20;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      will-change: transform;
    }

    h1 {
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .2em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--cyan) 0%, #fff 48%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleGlow 3.5s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 10px rgba(0,245,255,.45)); }
      to   { filter: drop-shadow(0 0 28px rgba(0,245,255,.9))
                     drop-shadow(0 0 55px rgba(255,0,228,.25)); }
    }

    .subtitle {
      font-size: .6rem;
      letter-spacing: .45em;
      color: rgba(0,245,255,.45);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .scores {
      display: flex; gap: 20px;
      margin-bottom: 14px;
    }
    .score-card {
      padding: 8px 18px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      font-size: .7rem;
      letter-spacing: .12em;
      display: flex; align-items: center; gap: 10px;
    }
    .score-x { color: var(--cyan);    border-color: rgba(0,245,255,.3); }
    .score-o { color: var(--magenta); border-color: rgba(255,0,228,.3); }
    .score-val {
      font-size: 1.5rem; font-weight: 900;
    }

    .status {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.75);
      margin-bottom: 18px;
      padding: 10px 26px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(12px);
      transition: all .35s;
    }
    .status.win-x {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(0,245,255,.08);
      box-shadow: 0 0 22px rgba(0,245,255,.35), inset 0 0 18px rgba(0,245,255,.06);
      animation: statusBeat .55s ease-in-out 3;
    }
    .status.win-o {
      color: var(--magenta);
      border-color: var(--magenta);
      background: rgba(255,0,228,.08);
      box-shadow: 0 0 22px rgba(255,0,228,.35), inset 0 0 18px rgba(255,0,228,.06);
      animation: statusBeat .55s ease-in-out 3;
    }
    .status.draw {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(255,215,0,.07);
      box-shadow: 0 0 22px rgba(255,215,0,.3);
    }
    @keyframes statusBeat {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 98px);
      gap: 10px;
      margin-bottom: 22px;
      padding: 14px;
      background: rgba(255,255,255,.025);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(22px);
      box-shadow: 0 0 70px rgba(0,245,255,.05),
                  inset 0 0 50px rgba(0,0,0,.3);
    }

    .cell {
      width: 98px; height: 98px;
      font-size: 2.6rem; font-weight: 900;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      cursor: pointer;
      transition: all .2s;
      position: relative; overflow: hidden;
      color: transparent;
    }
    .cell::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(255,255,255,.055) 0%, transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }
    .cell:hover:not(.taken) {
      border-color: rgba(0,245,255,.42);
      background: rgba(0,245,255,.055);
      box-shadow: 0 0 22px rgba(0,245,255,.14),
                  inset 0 0 14px rgba(0,245,255,.04);
      transform: scale(1.045);
    }
    .cell.x {
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan), 0 0 32px var(--cyan);
      border-color: rgba(0,245,255,.28);
    }
    .cell.o {
      color: var(--magenta);
      text-shadow: 0 0 14px var(--magenta), 0 0 32px var(--magenta);
      border-color: rgba(255,0,228,.28);
    }
    .cell.x.win {
      background: rgba(0,245,255,.1);
      box-shadow: 0 0 32px rgba(0,245,255,.5),
                  inset 0 0 22px rgba(0,245,255,.1);
      animation: winPulse .65s ease-in-out infinite alternate;
    }
    .cell.o.win {
      background: rgba(255,0,228,.1);
      box-shadow: 0 0 32px rgba(255,0,228,.5),
                  inset 0 0 22px rgba(255,0,228,.1);
      animation: winPulse .65s ease-in-out infinite alternate;
    }
    @keyframes winPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.09); }
    }
    .cell.taken { cursor: default; }

    .buttons { display: flex; gap: 12px; }

    button.primary {
      padding: 11px 26px;
      background: rgba(0,245,255,.1);
      color: var(--cyan);
      font-family: 'Orbitron', monospace;
      font-size: .7rem; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      border: 1px solid rgba(0,245,255,.45);
      border-radius: 10px; cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all .2s;
    }
    button.primary:hover {
      background: rgba(0,245,255,.18);
      box-shadow: 0 0 22px rgba(0,245,255,.3);
      transform: translateY(-2px);
    }

    button.secondary {
      padding: 11px 26px;
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.45);
      font-family: 'Orbitron', monospace;
      font-size: .7rem; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all .2s;
    }
    button.secondary:hover {
      color: rgba(255,255,255,.8);
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.07);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div id="cursor"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-trail"></div>

  <!-- Stars -->
  <canvas id="starfield"></canvas>

  <!-- Nebula glow blobs -->
  <div class="nebula" style="width:520px;height:520px;background:#5a0fb0;top:-120px;left:-80px;--op-from:.10;--op-to:.17;animation-delay:0s;"></div>
  <div class="nebula" style="width:420px;height:420px;background:#00c8ff;bottom:-80px;right:-60px;--op-from:.08;--op-to:.15;animation-delay:3.5s;"></div>
  <div class="nebula" style="width:320px;height:320px;background:#e000b0;top:38%;left:35%;--op-from:.05;--op-to:.10;animation-delay:6s;"></div>
  <div class="nebula" style="width:250px;height:250px;background:#ff5500;bottom:5%;left:5%;--op-from:.06;--op-to:.12;animation-delay:2s;"></div>

  <!-- Parallax scene -->
  <div id="scene">
    <!-- Layer 1: far / slow (depth 0.10) -->
    <div class="layer" id="l1" data-depth="0.10">
      <div class="planet planet-saturn"></div>
      <div class="planet planet-moon"></div>
      <div class="asteroid a4"></div>
      <div class="asteroid a5"></div>
    </div>
    <!-- Layer 2: mid (depth 0.28) -->
    <div class="layer" id="l2" data-depth="0.28">
      <div class="planet planet-gas"></div>
      <div class="planet planet-teal"></div>
      <div class="asteroid a6"></div>
    </div>
    <!-- Layer 3: close / fast (depth 0.52) -->
    <div class="layer" id="l3" data-depth="0.52">
      <div class="planet planet-ice"></div>
      <div class="planet planet-rocky"></div>
      <div class="planet planet-red"></div>
      <div class="asteroid a1"></div>
      <div class="asteroid a2"></div>
      <div class="asteroid a3"></div>
    </div>
  </div>

  <!-- Vignette + scanlines -->
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <!-- Game UI -->
  <div class="game-wrapper" id="game">
    <h1>Крестики-нолики</h1>
    <p class="subtitle">Space Edition &middot; PvE</p>

    <div class="scores">
      <div class="score-card score-x">
        ВЫ &middot; X <span class="score-val" id="sx">0</span>
      </div>
      <div class="score-card score-o">
        КОМП &middot; O <span class="score-val" id="so">0</span>
      </div>
    </div>

    <div class="status" id="status">Ваш ход</div>
    <div class="board" id="board"></div>

    <div class="buttons">
      <button class="primary"   onclick="newGame()">Новая игра</button>
      <button class="secondary" onclick="resetAll()">Сбросить счёт</button>
    </div>
  </div>

  <script>
    /* =========================================================
       CURSOR
    ========================================================= */
    const cursorEl = document.getElementById('cursor');
    const cursorDot = document.getElementById('cursor-dot');
    const cursorTrail = document.getElementById('cursor-trail');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let trailX = mouseX, trailY = mouseY;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX; mouseY = e.clientY;
      cursorEl.style.left  = mouseX + 'px';
      cursorEl.style.top   = mouseY + 'px';
      cursorDot.style.left = mouseX + 'px';
      cursorDot.style.top  = mouseY + 'px';
    });

    /* =========================================================
       STAR FIELD (canvas)
    ========================================================= */
    const canvas = document.getElementById('starfield');
    const ctx    = canvas.getContext('2d');

    let stars = [];
    let shooting = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); buildStars(); });

    function buildStars() {
      stars = [];
      const n = Math.floor(canvas.width * canvas.height / 2800);
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.4 + 0.2,
          phase: Math.random() * Math.PI * 2,
          speed: 0.018 + Math.random() * 0.04,
          bright: 0.35 + Math.random() * 0.65,
          blue: Math.random() < 0.12,
        });
      }
    }
    buildStars();

    function spawnShooter() {
      const angle = Math.PI / 5 + Math.random() * Math.PI / 7;
      const spd   = 9 + Math.random() * 9;
      shooting.push({
        x:   Math.random() * canvas.width * 0.8,
        y:   -12,
        vx:  Math.cos(angle) * spd,
        vy:  Math.sin(angle) * spd,
        len: 70 + Math.random() * 110,
        life: 1,
      });
      setTimeout(spawnShooter, 2200 + Math.random() * 5500);
    }
    spawnShooter();

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // stars
      for (const s of stars) {
        s.phase += s.speed;
        const a = s.bright * (0.55 + 0.45 * Math.sin(s.phase));
        ctx.globalAlpha = a;
        ctx.fillStyle = s.blue ? '#99ccff' : '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // shooting stars
      for (let i = shooting.length - 1; i >= 0; i--) {
        const ss = shooting[i];
        ss.x += ss.vx;
        ss.y += ss.vy;
        ss.life -= 0.013;
        if (ss.life <= 0 || ss.y > canvas.height + 80 || ss.x > canvas.width + 80) {
          shooting.splice(i, 1);
          continue;
        }
        const ang  = Math.atan2(ss.vy, ss.vx);
        const tx   = ss.x - Math.cos(ang) * ss.len;
        const ty   = ss.y - Math.sin(ang) * ss.len;
        if (Math.hypot(ss.x - tx, ss.y - ty) < 0.5) continue;

        const gr = ctx.createLinearGradient(ss.x, ss.y, tx, ty);
        gr.addColorStop(0,   `rgba(255,255,255,${ss.life})`);
        gr.addColorStop(0.4, `rgba(180,230,255,${ss.life * .5})`);
        gr.addColorStop(1,   'rgba(180,220,255,0)');

        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(tx, ty);
        ctx.strokeStyle = gr;
        ctx.lineWidth   = 1.6 * ss.life;
        ctx.stroke();
      }
    }

    /* =========================================================
       PARALLAX
    ========================================================= */
    const layers  = [...document.querySelectorAll('.layer')];
    const gameEl  = document.getElementById('game');

    let tgtX = 0, tgtY = 0;
    let curX = 0, curY = 0;

    document.addEventListener('mousemove', e => {
      tgtX = (e.clientX / window.innerWidth  - 0.5) * 2;
      tgtY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function applyParallax() {
      const t = 0.055;
      curX += (tgtX - curX) * t;
      curY += (tgtY - curY) * t;

      // trail cursor with lag
      trailX += (mouseX - trailX) * 0.12;
      trailY += (mouseY - trailY) * 0.12;
      cursorTrail.style.left = trailX + 'px';
      cursorTrail.style.top  = trailY + 'px';

      const MAX = 65;
      for (const layer of layers) {
        const d  = parseFloat(layer.dataset.depth);
        const dx = curX * MAX * d;
        const dy = curY * MAX * d;
        layer.style.transform = `translate(${dx}px,${dy}px)`;
      }
      // subtle game sway
      gameEl.style.transform = `translate(${curX * 6}px,${curY * 6}px)`;
    }

    /* =========================================================
       GAME LOGIC
    ========================================================= */
    const LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6],
    ];

    let board     = Array(9).fill(null);
    let scores    = { X: 0, O: 0 };
    let gameOver  = false;
    let playerTurn = true;

    function getWinner(b) {
      for (const [a, c, d] of LINES) {
        if (b[a] && b[a] === b[c] && b[a] === b[d])
          return { winner: b[a], line: [a, c, d] };
      }
      return null;
    }

    function minimax(b, isMax) {
      const r = getWinner(b);
      if (r) return r.winner === 'O' ? 10 : -10;
      if (b.every(Boolean)) return 0;

      if (isMax) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++)
          if (!b[i]) { b[i]='O'; best=Math.max(best,minimax(b,false)); b[i]=null; }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++)
          if (!b[i]) { b[i]='X'; best=Math.min(best,minimax(b,true));  b[i]=null; }
        return best;
      }
    }

    function bestMove() {
      let best = -Infinity, move = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const s = minimax(board, false);
          board[i] = null;
          if (s > best) { best = s; move = i; }
        }
      }
      return move;
    }

    function checkEnd() {
      const r = getWinner(board);
      if (r) { scores[r.winner]++; gameOver = true; }
      else if (board.every(Boolean)) gameOver = true;
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const r     = getWinner(board);
      const isDraw = !r && board.every(Boolean);

      board.forEach((cell, i) => {
        const btn = document.createElement('button');
        btn.className = 'cell'
          + (cell ? ` ${cell.toLowerCase()} taken` : '')
          + (r && r.line.includes(i) ? ' win' : '');
        btn.textContent = cell || '';
        btn.onclick = () => handleClick(i);
        boardEl.appendChild(btn);
      });

      const st = document.getElementById('status');
      if (r) {
        st.textContent = r.winner === 'X' ? '★ Победа!' : '★ Поражение!';
        st.className   = `status ${r.winner === 'X' ? 'win-x' : 'win-o'}`;
      } else if (isDraw) {
        st.textContent = '★ Ничья!';
        st.className   = 'status draw';
      } else {
        st.textContent = playerTurn ? 'Ваш ход' : 'ИИ вычисляет...';
        st.className   = 'status';
      }

      document.getElementById('sx').textContent = scores.X;
      document.getElementById('so').textContent = scores.O;
    }

    function handleClick(i) {
      if (board[i] || gameOver || !playerTurn) return;
      board[i]    = 'X';
      playerTurn  = false;
      checkEnd();
      render();
      if (!gameOver) {
        setTimeout(() => {
          board[bestMove()] = 'O';
          playerTurn = true;
          checkEnd();
          render();
        }, 350);
      }
    }

    function newGame() {
      board      = Array(9).fill(null);
      playerTurn = true;
      gameOver   = false;
      render();
    }

    function resetAll() {
      scores = { X: 0, O: 0 };
      newGame();
    }

    /* =========================================================
       MAIN LOOP
    ========================================================= */
    function loop() {
      drawCanvas();
      applyParallax();
      requestAnimationFrame(loop);
    }

    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
